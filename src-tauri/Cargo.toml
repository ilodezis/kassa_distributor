[package]
name = "kassa-distributor"
version = "2.0.0"
description = "Cash-register distribution tool"
authors = ["ilodezis"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name on Windows.
name = "kassa_distributor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
