[package]
name = "kassa-distributor"
version = "3.0.0"
description = "Cash-register distribution tool"
authors = ["ilodezis"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name on Windows.
name = "kassa_distributor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
# generate_context! embeds the plugin config from tauri.conf.json as serde_json values.
serde_json = "1.0.154"

# Over-the-air updates: signed packages from GitHub Releases, then a restart into the new version.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
