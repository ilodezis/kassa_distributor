name: build-mac

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Tests
        run: python -m pytest -q test_distribution.py

      - name: Build app
        run: |
          pyinstaller --noconfirm --windowed \
            --name kassa \
            --icon assets/icon.icns \
            --osx-bundle-identifier io.github.ilodezis.kassa-distributor \
            app.py
          ditto -c -k --keepParent dist/kassa.app "kassa_distributor_mac_${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: kassa_distributor_mac_${{ matrix.arch }}
          path: kassa_distributor_mac_${{ matrix.arch }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: kassa_distributor_mac_${{ matrix.arch }}.zip
