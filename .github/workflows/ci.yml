name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Apple Silicon macOS app as an unsigned .dmg: built by hand from the workflow page
  # (Run workflow) or on a v* tag, which also attaches the .dmg to the release.
  build-mac:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the app
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Locate the .dmg and check the app is arm64
        id: dmg
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          dmg=$(ls "$bundle"/dmg/*.dmg)
          echo "path=$dmg" >> "$GITHUB_OUTPUT"
          ls -lh "$dmg"
          for bin in "$bundle"/macos/*.app/Contents/MacOS/*; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            if [ "$archs" != "arm64" ]; then
              echo "::error::$bin is not an arm64 binary"; exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: kassa-distributor-mac-arm64
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.dmg.outputs.path }}

  # Windows x64 installer (NSIS, unsigned), built the same way as the macOS app.
  build-windows:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the installer
        run: npm run tauri build -- --bundles nsis

      - name: Locate the installer
        id: installer
        shell: bash
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*.exe)
          echo "path=$installer" >> "$GITHUB_OUTPUT"
          ls -lh "$installer"

      - uses: actions/upload-artifact@v7
        with:
          name: kassa-distributor-windows-x64
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.installer.outputs.path }}
