name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Apple Silicon macOS app: the .dmg for a first install and the .app.tar.gz the updater
  # downloads. Built by hand from the workflow page (Run workflow) or on a v* tag. No secrets
  # here: the build runs every crate's build script, so the signing key never comes near it.
  build-mac:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the app
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Check the app is arm64 and pack the release files
        run: |
          version=$(node -p 'require("./package.json").version')
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          app=$(ls -d "$bundle"/macos/*.app)
          for bin in "$app"/Contents/MacOS/*; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            if [ "$archs" != "arm64" ]; then
              echo "::error::$bin is not an arm64 binary"; exit 1
            fi
          done
          mkdir out
          # Asset names without spaces: GitHub rewrites them, and the updater URL must match.
          cp "$bundle"/dmg/*.dmg "out/kassa-distributor_${version}_aarch64.dmg"
          # The updater unpacks <name>.app/... and drops the first path segment: no "./" prefix,
          # no AppleDouble (._*) entries.
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "out/kassa-distributor_${version}_aarch64.app.tar.gz" \
            -C "$(dirname "$app")" "$(basename "$app")"
          tar -tzf out/*.app.tar.gz | head -3
          ls -lh out

      - uses: actions/upload-artifact@v7
        with:
          name: kassa-distributor-mac-arm64
          path: out/*
          if-no-files-found: error

  # Signs the update file and publishes the release. The only job that sees the signing key:
  # it runs in the `release` environment (secrets live there, tags only, approval on GitHub)
  # and builds nothing, so no third-party build script runs next to the key. latest.json is
  # written only after every signature checks out against the key built into the app, and
  # the release stays a draft until all files are on it.
  release:
    needs: build-mac
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      # Only for the Tauri CLI's signer; no install scripts run.
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from the tag message
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > notes.txt
          else
            : > notes.txt
          fi
          cat notes.txt

      - name: Sign the update files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in the release environment"; exit 1
          fi
          version=$(node -p 'require("./package.json").version')
          npx tauri signer sign --app-version "$version" dist/*.app.tar.gz

      - name: Write latest.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          node scripts/release/latest-json.ts --repo "$GITHUB_REPOSITORY" --tag "$TAG" \
            --notes-file notes.txt --out dist/latest.json \
            "darwin-aarch64=dist/kassa-distributor_${version}_aarch64.app.tar.gz"
          cat dist/latest.json

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: notes.txt
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.app.tar.gz
            dist/latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
